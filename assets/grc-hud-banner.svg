<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240" role="img" aria-label="GRC HUD banner for DK Mendiratta">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090C"/>
      <stop offset="55%" stop-color="#0C1016"/>
      <stop offset="100%" stop-color="#12080C"/>
    </linearGradient>
    <linearGradient id="phosphor" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3A6B4A"/>
      <stop offset="55%" stop-color="#7CFFB2"/>
      <stop offset="100%" stop-color="#E8DCC8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6B3A16"/>
      <stop offset="100%" stop-color="#E8B86D"/>
    </linearGradient>
    <linearGradient id="maroon" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4A1524"/>
      <stop offset="100%" stop-color="#C45C6A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="1100" height="4" patternUnits="userSpaceOnUse">
      <rect width="1100" height="2" fill="#000" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1100" height="240" fill="url(#bg)"/>
  <rect x="10" y="10" width="1080" height="220" rx="10" fill="none" stroke="#8B2942" stroke-width="1.2" opacity="0.9"/>
  <rect x="16" y="16" width="1068" height="208" rx="7" fill="none" stroke="#E8DCC8" stroke-width="0.4" opacity="0.28"/>

  <text x="28" y="38" fill="#8B2942" font-family="IBM Plex Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11" letter-spacing="2.2">SYS.GRC.HUD</text>
  <text x="160" y="38" fill="#7CFFB2" font-family="IBM Plex Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11" letter-spacing="1.4">STATUS: ACTIVE</text>
  <text x="820" y="38" fill="#E8DCC8" font-family="IBM Plex Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11" letter-spacing="1.6" opacity="0.7">CHANNEL / d33pm3</text>
  <circle cx="1070" cy="34" r="4" fill="#7CFFB2">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <line x1="28" y1="48" x2="1072" y2="48" stroke="#E8DCC8" stroke-opacity="0.18"/>

  <text x="28" y="84" fill="#E8DCC8" font-family="IBM Plex Sans, IBM Plex Mono, DejaVu Sans, sans-serif" font-size="28" font-weight="600">DK MENDIRATTA</text>
  <text x="28" y="110" fill="#C45C6A" font-family="IBM Plex Mono, DejaVu Sans Mono, Consolas, monospace" font-size="13" letter-spacing="1.1">CHARTERED ACCOUNTANT  ·  GOVERNANCE  ·  RISK  ·  FINANCE</text>
  <text x="28" y="132" fill="#A9B4A4" font-family="IBM Plex Mono, DejaVu Sans Mono, Consolas, monospace" font-size="12">Internal Audit  ·  Regulatory Compliance  ·  RegTech systems  ·  Internal tools</text>

  <g id="eq" transform="translate(28,158)">
    <g fill="url(#phosphor)" filter="url(#glow)">
      <rect x="0" width="14" y="28" height="22"><animate attributeName="height" values="10;34;16;28;12;34;10" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="32;8;26;14;30;8;32" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="20" width="14" y="18" height="32"><animate attributeName="height" values="18;40;14;30;22;38;18" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="24;2;28;12;20;4;24" dur="2.1s" repeatCount="indefinite"/></rect>
      <rect x="40" width="14" y="22" height="28"><animate attributeName="height" values="14;36;20;32;12;30;14" dur="2.7s" repeatCount="indefinite"/><animate attributeName="y" values="28;6;22;10;30;12;28" dur="2.7s" repeatCount="indefinite"/></rect>
      <rect x="60" width="14" y="8" height="42"><animate attributeName="height" values="22;42;16;36;24;40;22" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="20;0;26;6;18;2;20" dur="1.9s" repeatCount="indefinite"/></rect>
      <rect x="80" width="14" y="16" height="34"><animate attributeName="height" values="12;38;18;28;14;36;12" dur="2.5s" repeatCount="indefinite"/><animate attributeName="y" values="30;4;24;14;28;6;30" dur="2.5s" repeatCount="indefinite"/></rect>
      <rect x="100" width="14" y="24" height="26"><animate attributeName="height" values="8;32;14;26;10;34;8" dur="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="34;10;28;16;32;8;34" dur="2.2s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="url(#amber)" filter="url(#glow)">
      <rect x="120" width="14" y="12" height="38"><animate attributeName="height" values="16;40;20;34;12;38;16" dur="2.0s" repeatCount="indefinite"/><animate attributeName="y" values="26;2;22;8;30;4;26" dur="2.0s" repeatCount="indefinite"/></rect>
      <rect x="140" width="14" y="20" height="30"><animate attributeName="height" values="10;36;18;30;14;32;10" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="32;6;24;12;28;10;32" dur="2.6s" repeatCount="indefinite"/></rect>
      <rect x="160" width="14" y="6" height="44"><animate attributeName="height" values="20;44;18;38;24;42;20" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="22;0;24;4;18;0;22" dur="1.8s" repeatCount="indefinite"/></rect>
      <rect x="180" width="14" y="18" height="32"><animate attributeName="height" values="14;34;12;28;18;36;14" dur="2.3s" repeatCount="indefinite"/><animate attributeName="y" values="28;8;30;14;24;6;28" dur="2.3s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="url(#maroon)" filter="url(#glow)">
      <rect x="200" width="14" y="26" height="24"><animate attributeName="height" values="8;30;16;24;10;28;8" dur="2.8s" repeatCount="indefinite"/><animate attributeName="y" values="34;12;26;18;32;14;34" dur="2.8s" repeatCount="indefinite"/></rect>
      <rect x="220" width="14" y="14" height="36"><animate attributeName="height" values="18;40;14;32;20;36;18" dur="2.15s" repeatCount="indefinite"/><animate attributeName="y" values="24;2;28;10;22;6;24" dur="2.15s" repeatCount="indefinite"/></rect>
    </g>
    <text x="252" y="18" fill="#E8DCC8" font-family="IBM Plex Mono, DejaVu Sans Mono, Consolas, monospace" font-size="10" letter-spacing="1.4" opacity="0.55">CRT SIGNAL  ·  GOVERNANCE LOAD</text>
    <text x="252" y="36" fill="#7CFFB2" font-family="IBM Plex Mono, DejaVu Sans Mono, Consolas, monospace" font-size="10" letter-spacing="1.1">PDF → CLAUSE → CONTROL → REGISTER</text>
    <text x="252" y="54" fill="#A9B4A4" font-family="IBM Plex Mono, DejaVu Sans Mono, Consolas, monospace" font-size="10">boards  ·  audit committees  ·  CXOs</text>
  </g>

  <rect x="16" y="16" width="1068" height="3" fill="#7CFFB2" opacity="0.12">
    <animate attributeName="y" values="16;221;16" dur="4.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="16" y="16" width="1068" height="208" fill="url(#scan)" opacity="0.55"/>
</svg>
